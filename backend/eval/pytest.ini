[pytest]
# The harness needs its own config file. app/tests/pytest.ini sets
# `testpaths = .` and is only loaded when its own directory is the target, so
# `pytest eval/tests` from backend/ would otherwise get rootdir=backend with
# *no* configfile -- and therefore no --strict-markers, which is how an
# unregistered marker turns into a silent no-op instead of an error.
testpaths = .
python_files = test_*.py
python_functions = test_*
python_classes = Test*
addopts = --strict-markers
filterwarnings =
    ignore::DeprecationWarning
